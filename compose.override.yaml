services:
    telegram-bot-api:
        image: 'aiogram/telegram-bot-api:latest'
        restart: unless-stopped
        environment:
            TELEGRAM_API_ID: '${TELEGRAM_API_ID}'
            TELEGRAM_API_HASH: '${TELEGRAM_API_HASH}'
            TELEGRAM_LOCAL: '1'
        ports:
            - '127.0.0.1:${FORWARD_TELEGRAM_API_PORT:-8081}:8081'
        volumes:
            - 'sail-telegram-bot-api:/var/lib/telegram-bot-api'
        networks:
            - sail
volumes:
    sail-telegram-bot-api:
        driver: local
